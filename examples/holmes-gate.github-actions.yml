name: Holmes Evidence Gate

on:
  pull_request:
    paths:
      - "prompts/**"
      - "rag/**"
      - "models/**"
      - "policies/**"
      - "agents/**"
      - "holmes.policy.json"

jobs:
  holmes-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Holmes audit
        run: holmes audit --policy holmes.policy.json --changed-files --output latest-holmes-report.json

      - name: Enforce Holmes gate
        run: holmes gate --policy holmes.policy.json --report latest-holmes-report.json --fail-on-review

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holmes-evidence
          path: latest-holmes-report.json
